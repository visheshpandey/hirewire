<!-- Procedural 3D Canvas Render Engine with Gyro-Rings, Wireframe Lattice, and Kinetic Physics -->
<script data-purpose="procedural-3d-engine">
    (function () {
      const canvas = document.getElementById('model-canvas');
      const ctx = canvas.getContext('2d');
      let width, height, dpr;

      // 3D Rotation Variables
      let rotX = 0.25;
      let rotY = 0.4;
      let targetRotX = 0.25;
      let targetRotY = 0.4;
      let velocityX = 0.003;
      let velocityY = 0.005;

      let isDragging = false;
      let lastPointerX = 0;
      let lastPointerY = 0;

      // Mathematical vertices for an Icosahedron (12 vertices, 30 edges)
      const phi = (1 + Math.sqrt(5)) / 2;
      const baseVertices = [
        [-1,  phi, 0], [ 1,  phi, 0], [-1, -phi, 0], [ 1, -phi, 0],
        [0, -1,  phi], [0,  1,  phi], [0, -1, -phi], [0,  1, -phi],
        [ phi, 0, -1], [ phi, 0,  1], [-phi, 0, -1], [-phi, 0,  1]
      ];

      // Normalize vertices to unit sphere
      const icosahedronVertices = baseVertices.map(([x, y, z]) => {
        const len = Math.hypot(x, y, z);
        return [x / len, y / len, z / len];
      });

      // Calculate edges based on distance threshold
      const edges = [];
      for (let i = 0; i < icosahedronVertices.length; i++) {
        for (let j = i + 1; j < icosahedronVertices.length; j++) {
          const dx = icosahedronVertices[i][0] - icosahedronVertices[j][0];
          const dy = icosahedronVertices[i][1] - icosahedronVertices[j][1];
          const dz = icosahedronVertices[i][2] - icosahedronVertices[j][2];
          const dist = Math.hypot(dx, dy, dz);
          if (Math.abs(dist - 1.051) < 0.15) {
            edges.push([i, j]);
          }
        }
      }

      function resize() {
        dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
      }

      window.addEventListener('resize', resize);
      resize();

      // Mouse & Touch interaction
      function onPointerDown(e) {
        isDragging = true;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        lastPointerX = clientX;
        lastPointerY = clientY;
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        const deltaX = clientX - lastPointerX;
        const deltaY = clientY - lastPointerY;
        
        targetRotY += deltaX * 0.009;
        targetRotX += deltaY * 0.009;

        lastPointerX = clientX;
        lastPointerY = clientY;
      }

      function onPointerUp() {
        isDragging = false;
      }

      // Mouse move on window for interactive parallax tracking
      window.addEventListener('mousemove', (e) => {
        if (!isDragging) {
          const normX = (e.clientX / window.innerWidth) - 0.5;
          const normY = (e.clientY / window.innerHeight) - 0.5;
          targetRotY = rotY + (normX * 0.002);
          targetRotX = rotX + (normY * 0.002);
        }
      });

      canvas.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);

      canvas.addEventListener('touchstart', onPointerDown, { passive: true });
      window.addEventListener('touchmove', onPointerMove, { passive: true });
      window.addEventListener('touchend', onPointerUp);

      // Reset Core Orientation CTA
      const resetBtn = document.getElementById('btn-reset-3d');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          targetRotX = 0.25;
          targetRotY = 0.4;
          velocityX = 0.003;
          velocityY = 0.005;
        });
      }

      // 3D Projection Math (Enlarged scale radius)
      function project(x, y, z, scaleRadius) {
        // Rotate X
        const cosX = Math.cos(rotX);
        const sinX = Math.sin(rotX);
        const y1 = y * cosX - z * sinX;
        const z1 = y * sinX + z * cosX;

        // Rotate Y
        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);
        const x2 = x * cosY + z1 * sinY;
        const z2 = -x * sinY + z1 * cosY;

        // Perspective Camera projection (brought closer for magnified scale)
        const fov = 3.2;
        const distance = 3.6;
        const perspective = fov / (distance - z2);

        return {
          px: (width / 2) + x2 * scaleRadius * perspective,
          py: (height / 2) + y1 * scaleRadius * perspective,
          depth: z2,
          scale: perspective
        };
      }

      // Animation Loop
      function render() {
        // Continuous organic idle rotation when not dragging
        if (!isDragging) {
          rotY += velocityY;
          rotX += velocityX * 0.3;
        } else {
          rotX += (targetRotX - rotX) * 0.15;
          rotY += (targetRotY - rotY) * 0.15;
        }

        ctx.clearRect(0, 0, width, height);

        // Significantly increased scale radius (~1.7x previous size)
        const radius = Math.min(width, height) * 0.48;

        // Project Icosahedron vertices
        const projectedNodes = icosahedronVertices.map(([vx, vy, vz]) => {
          return project(vx, vy, vz, radius);
        });

        // 1. Draw Gyroscopic Outer Axis Ring (Tilted Orbit)
        ctx.beginPath();
        const steps = 72;
        for (let i = 0; i <= steps; i++) {
          const angle = (i / steps) * Math.PI * 2;
          const gx = Math.cos(angle) * 1.25;
          const gy = Math.sin(angle) * 1.25;
          const p = project(gx, gy, 0, radius);
          if (i === 0) ctx.moveTo(p.px, p.py);
          else ctx.lineTo(p.px, p.py);
        }
        ctx.strokeStyle = 'rgba(40, 40, 40, 0.45)';
        ctx.lineWidth = 1.2;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // 2. Draw Solid Black Wireframe Lattice Edges (Optimized for difference blend inversion)
        edges.forEach(([startIdx, endIdx]) => {
          const p1 = projectedNodes[startIdx];
          const p2 = projectedNodes[endIdx];

          const avgDepth = (p1.depth + p2.depth) / 2;
          // Depth alpha shading
          const alpha = Math.max(0.35, Math.min(1.0, (avgDepth + 1.2) / 2.0));

          ctx.beginPath();
          ctx.moveTo(p1.px, p1.py);
          ctx.lineTo(p2.px, p2.py);
          ctx.strokeStyle = `rgba(0, 0, 0, ${alpha})`;
          ctx.lineWidth = avgDepth > 0 ? 3.0 : 1.8;
          ctx.stroke();
        });

        // 3. Draw Center Pulsing Core (Expanded)
        const coreProj = project(0, 0, 0, radius);
        const coreGradient = ctx.createRadialGradient(
          coreProj.px, coreProj.py, 3,
          coreProj.px, coreProj.py, 36
        );
        coreGradient.addColorStop(0, 'rgba(0, 0, 0, 0.95)');
        coreGradient.addColorStop(0.5, 'rgba(30, 30, 30, 0.5)');
        coreGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = coreGradient;
        ctx.beginPath();
        ctx.arc(coreProj.px, coreProj.py, 36, 0, Math.PI * 2);
        ctx.fill();

        // 4. Draw Icosahedron Vertices / Solid Nodes
        projectedNodes.forEach((node) => {
          const nodeRadius = (node.depth + 1.5) * 4.2;
          const clampedRadius = Math.max(3.5, Math.min(9.5, nodeRadius));

          ctx.beginPath();
          ctx.arc(node.px, node.py, clampedRadius, 0, Math.PI * 2);
          ctx.fillStyle = '#000000';
          ctx.fill();

          // Subtle concentric orbit ring around closest foreground node
          if (node.depth > 0.7) {
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(node.px, node.py, clampedRadius + 5, 0, Math.PI * 2);
            ctx.stroke();
          }
        });

        requestAnimationFrame(render);
      }

      render();
    })();
  </script>
<!-- END: InteractiveScripts -->
